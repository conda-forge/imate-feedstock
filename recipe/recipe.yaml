schema_version: 1

context:
  name: imate
  version: "0.25.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/imate-${{ version }}.tar.gz
  sha256: 3abce50f1e1a2a241db9dc98d259dd88480e38ac274fd44e31bac05634746aa9

build:
  number: 1
  skip: win or match(python, ">=3.12") or match(python, "<=3.10")
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
  host:
    - if: osx
      then: llvm-openmp
    - if: linux
      then: libgomp
    - python
    - setuptools
    - wheel
    - scipy >=1.5
    - cython >=0.29,<3.0
    - pip
  run:
    - python
    - numpy >1.11
    - scipy >=1.5
    - matplotlib-base >=2.0

tests:
  - python:
      imports:
        - imate
      pip_check: true

about:
  summary: Implicit Matrix Trace Estimator. Computes the trace of functions of implicit matrices. Accelerated on CPU and CUDA-capable GPU devices.
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://github.com/ameli/imate
  repository: https://github.com/ameli/imate

extra:
  recipe-maintainers:
    - jan-janssen
