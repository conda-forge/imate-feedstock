{% set name = "imate" %}
{% set version = "0.29.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/imate-{{ version }}.tar.gz
  sha256: 596b2c5726764f2c87599346cd5a421b6cd7056fde486a680b2a85ce41ca311c

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  skip: true  # [win or py>=312 or py<=310]

requirements:
  build:
    - {{ compiler("c") }}
    - {{ compiler("cxx") }}
    - {{ stdlib("c") }}
  host:
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
    - python
    - setuptools
    - wheel
    - scipy >=1.5
    - cython >=0.29,<3.0
    - pip
  run:
    - python
    - numpy >1.22
    - scipy >=1.8
    - matplotlib-base >=2.0

test:
  imports:
    - imate
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/ameli/imate
  summary: Implicit Matrix Trace Estimator. Computes the trace of functions of implicit matrices. Accelerated on CPU and CUDA-capable GPU devices.
  dev_url: https://github.com/ameli/imate
  license: BSD-3-Clause
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - jan-janssen
